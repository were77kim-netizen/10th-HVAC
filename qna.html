<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>실시간 세션 Q&A - 2026 HVAC Engineering Expert Seminar</title>

  <meta name="description" content="2026 HVAC Engineering Expert Seminar 세션별 실시간 질문 등록 및 질의응답 보드">
  <meta property="og:title" content="2026 HVAC Engineering Expert Seminar 실시간 Q&A">
  <meta property="og:description" content="세션별로 강연자에게 궁금한 점을 질문하고 다른 참가자들의 질문에 공감해 보세요.">
  <meta name="theme-color" content="#0b0407">

  <style>
    :root {
      --bg: #0b0407;
      --burgundy: #831335;
      --burgundy-bright: #a81c46;
      --burgundy-glow: #e61f5c;
      --red-light: #ff5366;
      --kakao-yellow: #fee500;
      --kakao-text: #391b1b;
      --card-bg: #14080e;
      --card-border: rgba(255, 255, 255, 0.12);
      --text-muted: rgba(255, 255, 255, 0.65);
      --font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      word-break: keep-all;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    /* 시그니처 conic 배경 */
    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: conic-gradient(
        from 142.5deg at 50% 50%,
        #080405 0deg,
        #150409 20deg,
        #490b1e 48deg,
        #831335 78deg,
        #9d163e 98deg,
        #440919 140deg,
        #080405 178deg,
        #120408 190deg,
        #360917 222deg,
        #821334 260deg,
        #9d163f 282deg,
        #4f0c20 330deg,
        #080405 360deg
      );
      opacity: 0.9;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 10%, rgba(230, 31, 92, 0.15), transparent 70%),
                  linear-gradient(180deg, rgba(8, 4, 5, 0.82) 0%, rgba(8, 4, 5, 0.96) 100%);
    }

    /* 상단 탑바 */
    .top-nav {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      width: 100%;
      max-width: 580px;
      padding: 14px 18px;
      background: rgba(11, 4, 7, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-presenter-mode {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-presenter-mode.active {
      background: #831335;
      border-color: #ff5366;
      color: #fff;
    }

    /* 메인 컨테이너 */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 580px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 인트로 카드 */
    .qna-intro-card {
      background: linear-gradient(135deg, rgba(131, 19, 53, 0.4) 0%, rgba(20, 8, 14, 0.75) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 20px 18px;
    }

    .qna-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      color: #ff9aa5;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 8px;
    }

    .qna-intro-card h1 {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .qna-intro-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 카카오 채널 1:1 질문 바 */
    .kakao-qna-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(254, 229, 0, 0.08);
      border: 1px solid rgba(254, 229, 0, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .kakao-qna-text {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.4;
    }

    .kakao-qna-text strong {
      color: var(--kakao-yellow);
    }

    .btn-kakao-chat {
      background: var(--kakao-yellow);
      color: var(--kakao-text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      padding: 8px 12px;
      border-radius: 8px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 질문 작성 카드 */
    .ask-card {
      background: rgba(20, 8, 14, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ask-card-title {
      font-size: 15px;
      font-weight: 850;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-session {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .select-session option {
      background: #14080e;
      color: #fff;
    }

    .textarea-question {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 13.5px;
      font-family: inherit;
      min-height: 80px;
      resize: vertical;
      line-height: 1.5;
      outline: none;
    }

    .textarea-question:focus {
      border-color: var(--red-light);
    }

    .ask-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ask-meta-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-author {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      width: 110px;
      font-family: inherit;
    }

    .checkbox-anon {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    .btn-submit-q {
      background: linear-gradient(135deg, #a81c46, #e61f5c);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 850;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit-q:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    /* 세션 탭 필터 */
    .session-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .session-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #831335;
      border-color: #ff5366;
      color: #ffffff;
      font-weight: 900;
    }

    /* 질문 피드 목록 */
    .qna-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .qna-card {
      background: rgba(20, 8, 14, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s;
    }

    .qna-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .qna-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .qna-session-badge {
      font-size: 11px;
      font-weight: 800;
      color: #ff9aa5;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 99px;
    }

    .qna-meta {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      gap: 8px;
    }

    .qna-body {
      font-size: 14.5px;
      line-height: 1.5;
      color: #ffffff;
    }

    .qna-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-like {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-like:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-like.liked {
      background: rgba(230, 31, 92, 0.25);
      border-color: var(--red-light);
      color: var(--red-light);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13.5px;
    }

    /* 발표자/전광판 모드 */
    body.presenter-mode .qna-card {
      padding: 24px 26px;
      background: #1b0a13;
      border-color: rgba(255, 255, 255, 0.25);
    }

    body.presenter-mode .qna-body {
      font-size: 20px;
      line-height: 1.5;
      font-weight: 800;
    }

    body.presenter-mode .qna-session-badge {
      font-size: 13px;
      padding: 5px 12px;
    }

    body.presenter-mode .ask-card,
    body.presenter-mode .kakao-qna-bar {
      display: none;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1c0e15;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="bg-overlay"></div>

  <!-- 상단 네비게이션 -->
  <header class="top-nav">
    <div class="nav-left">
      <a class="back-btn" href="./checkin.html" aria-label="이전으로">←</a>
      <div class="nav-title">실시간 세션 Q&A</div>
    </div>
    <div class="nav-actions">
      <button class="btn-presenter-mode" id="btnPresenterMode" type="button" title="발표자 전광판 뷰">
        🖥️ 발표모드
      </button>
      <a class="back-btn" href="./index.html" title="홈으로" style="font-size: 13px;">🏠</a>
    </div>
  </header>

  <main class="container">
    <!-- 인트로 카드 -->
    <div class="qna-intro-card">
      <span class="qna-badge">INTERACTIVE Q&A BOARD</span>
      <h1>연사에게 직접 질문하기</h1>
      <p>
        강연 중 궁금한 점을 남겨주시면, 각 세션 종료 후 Q&A 시간 및 종합 토론 시 우선적으로 답변해 드립니다.
      </p>
    </div>

    <!-- 카카오톡 채널 1:1 질문 연계 바 -->
    <div class="kakao-qna-bar">
      <div class="kakao-qna-text">
        <strong>💬 카카오톡 채널 1:1 질문</strong><br>
        카톡으로 익명/직접 질문하고 싶다면 채널 채팅을 이용하세요.
      </div>
      <a class="btn-kakao-chat" target="_blank" rel="noopener noreferrer" href="https://pf.kakao.com/_hvac2026">
        카톡 1:1 질문 ↗
      </a>
    </div>

    <!-- 질문 작성 폼 -->
    <div class="ask-card">
      <div class="ask-card-title">✍️ 질문 등록하기</div>
      
      <select class="select-session" id="askSession">
        <option value="all">세션을 선택하세요 (공통/전체)</option>
        <option value="k1">Keynote 1: 국내주거난방의 변천과 현황 (여명석 교수)</option>
        <option value="k2">Keynote 2: AI 서버 액체냉각 및 데이터센터 (이성혁 교수)</option>
        <option value="k3">Keynote 3: 전력시장 현황 및 AIDC 전력공급 (조홍종 교수)</option>
        <option value="i1">Insight 1: 공동주택 공기열원 히트펌프 (유정현 수석)</option>
        <option value="i2">Insight 2: 에너지컨설팅 사례 발표 (오영훈 팀장)</option>
        <option value="sl">Special: 과학 및 인문학 강의 (이정모 관장)</option>
      </select>

      <textarea
        class="textarea-question"
        id="askContent"
        placeholder="강연 내용과 관련하여 궁금한 사항을 자유롭게 작성해 주세요."
      ></textarea>

      <div class="ask-row-bottom">
        <div class="ask-meta-input">
          <input type="text" class="input-author" id="askAuthor" placeholder="작성자 이름" />
          <label class="checkbox-anon">
            <input type="checkbox" id="checkAnon" />
            <span>익명</span>
          </label>
        </div>
        <button class="btn-submit-q" id="btnSubmitQ" type="button">질문 등록</button>
      </div>
    </div>

    <!-- 세션 필터 탭 -->
    <div class="session-tabs" id="sessionTabs">
      <button class="tab-btn active" data-filter="all">전체 질문 (<span id="countAll">0</span>)</button>
      <button class="tab-btn" data-filter="k1">주거난방</button>
      <button class="tab-btn" data-filter="k2">AI 액체냉각</button>
      <button class="tab-btn" data-filter="k3">AIDC 전력망</button>
      <button class="tab-btn" data-filter="i1">히트펌프</button>
      <button class="tab-btn" data-filter="i2">에너지컨설팅</button>
      <button class="tab-btn" data-filter="sl">과학인문학</button>
    </div>

    <!-- 실시간 질문 피드 목록 -->
    <div class="qna-feed" id="qnaFeed">
      <!-- JS로 동적 렌더링 -->
    </div>
  </main>

  <div class="toast" id="toast">알림</div>

  <script>
    // 기본 샘플 및 로컬스토리지 연동 질문 데이터
    const defaultQuestions = [
      {
        id: 1,
        session: 'k2',
        sessionName: 'Keynote 2 · 액체냉각',
        author: '시스템엔지니어',
        content: '기존 공랭식 서버룸에서 Direct-to-Chip(D2C) 액체냉각으로 전환 시 배관 누수(Leakage)에 대한 안전 가이드나 자동 차단 표준이 국내에도 정립되어 있는지 궁금합니다.',
        time: '오전 10:45',
        likes: 12,
        isLiked: false
      },
      {
        id: 2,
        session: 'k1',
        sessionName: 'Keynote 1 · 주거난방',
        author: '건축설계 엔지니어',
        content: '바닥 복사난방에서 난방 배관 피치(간격) 및 단열 두께에 따른 층간소음 저감 효과와 열전달 효율 사이의 최적 트레이드오프 기준이 있는지요?',
        time: '오전 09:50',
        likes: 8,
        isLiked: false
      },
      {
        id: 3,
        session: 'k3',
        sessionName: 'Keynote 3 · AIDC 전력망',
        author: '익명',
        content: '비수도권 분산에너지 특구로 데이터센터를 이전할 때 전력 요금(한전 계약전력) 혜택이나 송배전 손실 비용 보전 정책이 언제쯤 구체화될까요?',
        time: '오전 11:55',
        likes: 15,
        isLiked: false
      }
    ];

    let currentFilter = 'all';
    let questions = [];

    // 로컬스토리지에서 기존 질문 복원
    try {
      const saved = localStorage.getItem('hvac_qna_list');
      if (saved) {
        questions = JSON.parse(saved);
      } else {
        questions = [...defaultQuestions];
      }
    } catch (e) {
      questions = [...defaultQuestions];
    }

    // 체크인된 이름이 있으면 작성자 필드 자동 채우기
    try {
      const user = localStorage.getItem('hvac_user_checked');
      if (user) {
        const parsed = JSON.parse(user);
        if (parsed.name) {
          document.getElementById('askAuthor').value = parsed.name;
        }
      }
    } catch (e) {}

    const sessionNames = {
      'all': '공통 질의',
      'k1': 'Keynote 1 · 주거난방',
      'k2': 'Keynote 2 · 액체냉각',
      'k3': 'Keynote 3 · AIDC 전력망',
      'i1': 'Insight 1 · 히트펌프',
      'i2': 'Insight 2 · 에너지컨설팅',
      'sl': 'Special · 과학인문학'
    };

    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 피드 렌더링
    function renderFeed() {
      const feed = document.getElementById('qnaFeed');
      feed.innerHTML = '';

      const filtered = questions.filter(q => currentFilter === 'all' || q.session === currentFilter);
      document.getElementById('countAll').textContent = questions.length;

      if (filtered.length === 0) {
        feed.innerHTML = '<div class="empty-state">등록된 질문이 없습니다. 첫 질문을 남겨보세요! ✋</div>';
        return;
      }

      // 공감수(좋아요) 순 정렬
      filtered.sort((a, b) => b.likes - a.likes);

      filtered.forEach(q => {
        const card = document.createElement('div');
        card.className = 'qna-card';
        card.innerHTML = `
          <div class="qna-card-top">
            <span class="qna-session-badge">${q.sessionName}</span>
            <div class="qna-meta">
              <span>👤 ${q.author}</span>
              <span>🕒 ${q.time}</span>
            </div>
          </div>
          <div class="qna-body">${escapeHtml(q.content)}</div>
          <div class="qna-footer">
            <span style="font-size: 11.5px; opacity: 0.5;">세미나 현장 질문</span>
            <button class="btn-like ${q.isLiked ? 'liked' : ''}" type="button" data-id="${q.id}">
              👍 공감 ${q.likes}
            </button>
          </div>
        `;
        feed.appendChild(card);
      });

      // 공감 버튼 이벤트
      feed.querySelectorAll('.btn-like').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-id'), 10);
          const target = questions.find(item => item.id === id);
          if (target) {
            if (!target.isLiked) {
              target.likes++;
              target.isLiked = true;
              showToast('👍 질문에 공감했습니다!');
            } else {
              target.likes--;
              target.isLiked = false;
            }
            saveQuestions();
            renderFeed();
          }
        });
      });
    }

    function saveQuestions() {
      try {
        localStorage.setItem('hvac_qna_list', JSON.stringify(questions));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 탭 클릭 이벤트
    document.querySelectorAll('.tab-btn').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        renderFeed();
      });
    });

    // 익명 체크박스
    const checkAnon = document.getElementById('checkAnon');
    const inputAuthor = document.getElementById('askAuthor');
    checkAnon.addEventListener('change', () => {
      if (checkAnon.checked) {
        inputAuthor.disabled = true;
        inputAuthor.style.opacity = '0.5';
      } else {
        inputAuthor.disabled = false;
        inputAuthor.style.opacity = '1';
      }
    });

    // 질문 등록 버튼
    document.getElementById('btnSubmitQ').addEventListener('click', () => {
      const content = document.getElementById('askContent').value.trim();
      const sessionKey = document.getElementById('askSession').value;
      let author = inputAuthor.value.trim();

      if (!content) {
        showToast('⚠️ 질문 내용을 입력해 주세요.');
        document.getElementById('askContent').focus();
        return;
      }

      if (checkAnon.checked || !author) {
        author = '익명 참가자';
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      const newQ = {
        id: Date.now(),
        session: sessionKey === 'all' ? 'k1' : sessionKey,
        sessionName: sessionNames[sessionKey] || '공통 질의',
        author: author,
        content: content,
        time: timeStr,
        likes: 1,
        isLiked: true
      };

      questions.unshift(newQ);
      saveQuestions();
      document.getElementById('askContent').value = '';
      showToast('🎉 질문이 성공적으로 등록되었습니다!');
      renderFeed();
    });

    // 발표자 모드 (전광판 화면) 토글
    const btnPresenter = document.getElementById('btnPresenterMode');
    btnPresenter.addEventListener('click', () => {
      document.body.classList.toggle('presenter-mode');
      const isPresenter = document.body.classList.contains('presenter-mode');
      btnPresenter.classList.toggle('active', isPresenter);
      btnPresenter.textContent = isPresenter ? '📱 일반모드' : '🖥️ 발표모드';
      showToast(isPresenter ? '🖥️ 발표자/전광판 뷰로 전환되었습니다.' : '📱 일반 뷰로 전환되었습니다.');
    });

    // 초기 렌더링
    renderFeed();
  </script>
</body>
</html>
