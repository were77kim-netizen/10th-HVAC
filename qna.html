<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>실시간 세션 Q&A - 2026 HVAC Engineering Expert Seminar</title>

  <meta name="description" content="2026 HVAC Engineering Expert Seminar 세션별 실시간 질문 등록 및 질의응답 보드">
  <meta property="og:title" content="2026 HVAC Engineering Expert Seminar 실시간 Q&A">
  <meta property="og:description" content="세션별로 강연자에게 궁금한 점을 질문하고 다른 참가자들의 질문에 공감해 보세요.">
  <meta name="theme-color" content="#040906">

  <!-- Dynamic Theme & Link Sync from Admin Settings -->
  <script>
    (function() {
      try {
        const theme = JSON.parse(localStorage.getItem('hvac_theme_settings') || 'null');
        if (theme && theme.vars) {
          let css = ':root {\n';
          for (const [k, v] of Object.entries(theme.vars)) {
            css += `  ${k}: ${v} !important;\n`;
          }
          css += '}\n';
          if (theme.gradient) {
            css += `body, .hero, .bg-canvas, .bg-gradient { background: ${theme.gradient} !important; }\n`;
          }
          const style = document.createElement('style');
          style.id = 'hvac-custom-theme-style';
          style.textContent = css;
          document.head.appendChild(style);
        }
      } catch (e) {}

      window.addEventListener('DOMContentLoaded', function() {
        try {
          const links = JSON.parse(localStorage.getItem('hvac_site_links') || 'null');
          if (links) {
            if (links.kakaoChannel) {
              document.querySelectorAll('a[href*="pf.kakao.com"]').forEach(function(a) {
                if (a.href.includes('/chat')) {
                  a.href = links.kakaoChat || (links.kakaoChannel + '/chat');
                } else {
                  a.href = links.kakaoChannel;
                }
              });
            }
            if (links.surveyForm) {
              document.querySelectorAll('a[href*="ResponsePage.aspx"], a[href*="forms.cloud.microsoft"]').forEach(function(a) {
                if (!a.href.includes('/r/kaugdHpUxh')) {
                  a.href = links.surveyForm;
                }
              });
            }
            if (links.attendanceForm) {
              document.querySelectorAll('a[href*="/r/kaugdHpUxh"]').forEach(function(a) {
                a.href = links.attendanceForm;
              });
            }
          }
        } catch (e) {}
      });
    })();
  </script>

  <style>
    :root {
      --bg: #040906;
      --primary: #108548;
      --primary-light: #22c55e;
      --gold: #d4a017;
      --gold-light: #f3c448;
      --burgundy: #0e5e34;
      --burgundy-bright: #108548;
      --burgundy-glow: #22c55e;
      --red-light: #f3c448;
      --kakao-yellow: #fee500;
      --kakao-text: #391b1b;
      --card-bg: #0b140e;
      --card-border: rgba(255, 255, 255, 0.12);
      --text-muted: rgba(255, 255, 255, 0.68);
      --font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      word-break: keep-all;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    /* 시그니처 포레스트 그린 & 골드 conic 배경 */
    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: conic-gradient(
        from 142.5deg at 50% 50%,
        #040906 0deg,
        #08170e 20deg,
        #0e3e23 48deg,
        #126b3a 78deg,
        #b88a18 98deg,
        #0f502c 140deg,
        #040906 178deg,
        #06130b 190deg,
        #0d361f 222deg,
        #116135 260deg,
        #c99a22 282deg,
        #0b3a20 330deg,
        #040906 360deg
      );
      opacity: 0.92;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 10%, rgba(34, 197, 94, 0.14), transparent 70%),
                  linear-gradient(180deg, rgba(4, 9, 6, 0.82) 0%, rgba(4, 9, 6, 0.96) 100%);
    }

    /* 상단 탑바 */
    .top-nav {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      width: 100%;
      max-width: 600px;
      padding: 14px 18px;
      background: rgba(4, 9, 6, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .nav-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-presenter-mode {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.88);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-presenter-mode.active {
      background: var(--primary);
      border-color: var(--gold-light);
      color: #fff;
    }

    /* 메인 컨테이너 */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    body.presenter-mode .top-nav,
    body.presenter-mode .container {
      max-width: 960px;
    }

    /* 인트로 카드 */
    .qna-intro-card {
      background: linear-gradient(135deg, rgba(16, 133, 72, 0.38) 0%, rgba(11, 20, 14, 0.85) 100%);
      border: 1px solid rgba(243, 196, 72, 0.25);
      border-radius: 18px;
      padding: 20px 18px;
    }

    .qna-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      color: var(--gold-light);
      background: rgba(243, 196, 72, 0.12);
      border: 1px solid rgba(243, 196, 72, 0.3);
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 8px;
    }

    .qna-intro-card h1 {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .qna-intro-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 카카오 채널 1:1 질문 바 */
    .kakao-qna-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(254, 229, 0, 0.08);
      border: 1px solid rgba(254, 229, 0, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .kakao-qna-text {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.4;
    }

    .kakao-qna-text strong {
      color: var(--kakao-yellow);
    }

    .btn-kakao-chat {
      background: var(--kakao-yellow);
      color: var(--kakao-text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      padding: 8px 12px;
      border-radius: 8px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 질문 작성 카드 */
    .ask-card {
      background: rgba(11, 20, 14, 0.92);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ask-card-title {
      font-size: 15px;
      font-weight: 850;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-session {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .select-session option {
      background: #0b140e;
      color: #fff;
    }

    .textarea-question {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 13.5px;
      font-family: inherit;
      min-height: 80px;
      resize: vertical;
      line-height: 1.5;
      outline: none;
    }

    .textarea-question:focus {
      border-color: var(--gold-light);
    }

    .ask-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ask-meta-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-author {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      width: 120px;
      font-family: inherit;
    }

    .checkbox-anon {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
    }

    .btn-submit-q {
      background: linear-gradient(135deg, var(--primary), #0d6e3a);
      border: 1px solid rgba(243, 196, 72, 0.35);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 850;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-submit-q:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    /* 세션 탭 필터 & 정렬 바 */
    .filter-controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .session-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .session-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--gold-light);
      color: #ffffff;
      font-weight: 900;
    }

    .feed-subbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .search-qna-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 7px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }

    .search-qna-input:focus {
      border-color: var(--gold-light);
    }

    .sort-btns {
      display: flex;
      gap: 6px;
    }

    .btn-sort {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 750;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-sort.active {
      background: rgba(243, 196, 72, 0.16);
      border-color: rgba(243, 196, 72, 0.45);
      color: var(--gold-light);
      font-weight: 850;
    }

    /* 질문 피드 목록 */
    .qna-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .qna-card {
      background: rgba(11, 20, 14, 0.88);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s;
    }

    .qna-card.starred-card {
      border-color: rgba(243, 196, 72, 0.45);
      background: linear-gradient(135deg, rgba(243, 196, 72, 0.08) 0%, rgba(11, 20, 14, 0.92) 100%);
    }

    .qna-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
    }

    .qna-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .qna-badges-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .qna-session-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-light);
      background: rgba(243, 196, 72, 0.12);
      border: 1px solid rgba(243, 196, 72, 0.25);
      padding: 3px 9px;
      border-radius: 99px;
    }

    .qna-status-tag {
      font-size: 10.5px;
      font-weight: 850;
      padding: 3px 8px;
      border-radius: 99px;
    }

    .qna-status-tag.starred {
      background: rgba(243, 196, 72, 0.2);
      color: #f3c448;
      border: 1px solid rgba(243, 196, 72, 0.4);
    }

    .qna-status-tag.answered {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .qna-meta {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      gap: 8px;
    }

    .qna-body {
      font-size: 14.5px;
      line-height: 1.55;
      color: #ffffff;
    }

    .qna-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-like {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .btn-like:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-like.liked {
      background: rgba(16, 133, 72, 0.28);
      border-color: var(--primary-light);
      color: #4ade80;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13.5px;
    }

    /* 발표자/전광판 모드 */
    body.presenter-mode .qna-card {
      padding: 24px 28px;
      background: #0d1a12;
      border-color: rgba(243, 196, 72, 0.3);
    }

    body.presenter-mode .qna-body {
      font-size: 21px;
      line-height: 1.5;
      font-weight: 800;
    }

    body.presenter-mode .qna-session-badge {
      font-size: 13px;
      padding: 5px 12px;
    }

    body.presenter-mode .ask-card,
    body.presenter-mode .kakao-qna-bar {
      display: none;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0b1911;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(243, 196, 72, 0.35);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="bg-overlay"></div>

  <!-- 상단 네비게이션 -->
  <header class="top-nav">
    <div class="nav-left">
      <a class="back-btn" href="./checkin.html" aria-label="체크인 화면으로">←</a>
      <div class="nav-title">실시간 세션 Q&A</div>
    </div>
    <div class="nav-actions">
      <button class="btn-presenter-mode" id="btnPresenterMode" type="button" title="발표자 전광판 뷰">
        🖥️ 발표모드
      </button>
      <a class="back-btn" href="./quiz.html" title="세션 퀴즈 챌린지" style="font-size: 13px;">💡</a>
      <a class="back-btn" href="./index.html" title="메인 홈으로" style="font-size: 13px;">🏠</a>
    </div>
  </header>

  <main class="container">
    <!-- 인트로 카드 -->
    <div class="qna-intro-card">
      <span class="qna-badge">INTERACTIVE Q&A BOARD</span>
      <h1>연사에게 직접 질문하기</h1>
      <p>
        강연 중 궁금한 점을 남겨주시면, 각 세션 종료 후 Q&A 시간에 우선적으로 답변해 드립니다.
      </p>
    </div>

    <!-- 카카오톡 채널 1:1 질문 연계 바 -->
    <div class="kakao-qna-bar">
      <div class="kakao-qna-text">
        <strong>💬 카카오톡 채널 1:1 질문</strong><br>
        카톡으로 익명/직접 질문하고 싶다면 채널 채팅을 이용하세요.
      </div>
      <a class="btn-kakao-chat" target="_blank" rel="noopener noreferrer" href="https://pf.kakao.com/_hvac2026">
        카톡 1:1 질문 ↗
      </a>
    </div>

    <!-- 질문 작성 폼 -->
    <div class="ask-card">
      <div class="ask-card-title">✍️ 질문 등록하기</div>
      
      <select class="select-session" id="askSession">
        <option value="all">세션을 선택하세요 (공통/전체)</option>
        <option value="k1">Keynote 1: 국내주거난방의 변천과 현황 (여명석 교수)</option>
        <option value="k2">Keynote 2: AI 서버 액체냉각 및 데이터센터 (이성혁 교수)</option>
        <option value="k3">Keynote 3: 전력시장 현황 및 AIDC 전력공급 (조홍종 교수)</option>
        <option value="i1">Insight 1: 헬로우 히트펌프, 굿바이 보일러 (유정현 수석)</option>
        <option value="i2">Insight 2: 에너지컨설팅 사례 발표 (오영훈 팀장)</option>
        <option value="sl">Special: 테라포밍 또는 찬란한 멸종 (이정모 관장)</option>
      </select>

      <textarea
        class="textarea-question"
        id="askContent"
        placeholder="강연 내용과 관련하여 궁금한 사항을 자유롭게 작성해 주세요."
      ></textarea>

      <div class="ask-row-bottom">
        <div class="ask-meta-input">
          <input type="text" class="input-author" id="askAuthor" placeholder="작성자 이름" />
          <label class="checkbox-anon">
            <input type="checkbox" id="checkAnon" />
            <span>익명</span>
          </label>
        </div>
        <button class="btn-submit-q" id="btnSubmitQ" type="button">질문 등록</button>
      </div>
    </div>

    <!-- 세션 필터 탭 & 정렬/검색 바 -->
    <div class="filter-controls-wrap">
      <div class="session-tabs" id="sessionTabs">
        <button class="tab-btn active" data-filter="all">전체 질문 (<span id="countAll">0</span>)</button>
        <button class="tab-btn" data-filter="k1">주거난방</button>
        <button class="tab-btn" data-filter="k2">AI 액체냉각</button>
        <button class="tab-btn" data-filter="k3">AIDC 전력망</button>
        <button class="tab-btn" data-filter="i1">히트펌프</button>
        <button class="tab-btn" data-filter="i2">에너지컨설팅</button>
        <button class="tab-btn" data-filter="sl">과학인문학</button>
      </div>

      <div class="feed-subbar">
        <input type="text" id="qnaSearchBox" class="search-qna-input" placeholder="🔍 질문 내용 또는 작성자 검색..." />
        <div class="sort-btns">
          <button type="button" class="btn-sort active" id="btnSortLikes" data-sort="likes">👍 공감순</button>
          <button type="button" class="btn-sort" id="btnSortNewest" data-sort="newest">🕒 최신순</button>
        </div>
      </div>
    </div>

    <!-- 실시간 질문 피드 목록 -->
    <div class="qna-feed" id="qnaFeed">
      <!-- JS로 동적 렌더링 -->
    </div>
  </main>

  <div class="toast" id="toast">알림</div>

  <script>
    // 기본 샘플 질문 데이터
    const defaultQuestions = [
      {
        id: 1,
        session: 'k2',
        sessionName: 'Keynote 2 · 액체냉각',
        author: '시스템엔지니어',
        content: '기존 공랭식 서버룸에서 Direct-to-Chip(D2C) 액체냉각으로 전환 시 배관 누수(Leakage)에 대한 안전 가이드나 자동 차단 표준이 국내에도 정립되어 있는지 궁금합니다.',
        time: '오전 10:45',
        likes: 12,
        isLiked: false
      },
      {
        id: 2,
        session: 'k1',
        sessionName: 'Keynote 1 · 주거난방',
        author: '건축설계 엔지니어',
        content: '바닥 복사난방에서 난방 배관 피치(간격) 및 단열 두께에 따른 층간소음 저감 효과와 열전달 효율 사이의 최적 트레이드오프 기준이 있는지요?',
        time: '오전 09:50',
        likes: 8,
        isLiked: false
      },
      {
        id: 3,
        session: 'k3',
        sessionName: 'Keynote 3 · AIDC 전력망',
        author: '익명',
        content: '비수도권 분산에너지 특구로 데이터센터를 이전할 때 전력 요금(한전 계약전력) 혜택이나 송배전 손실 비용 보전 정책이 언제쯤 구체화될까요?',
        time: '오전 11:55',
        likes: 15,
        isLiked: false
      }
    ];

    let currentFilter = 'all';
    let currentSort = 'likes';
    let questions = [];

    // 기본 세션 매핑 테이블 (Admin 프로그램/세션 관리와 자동 호환)
    let sessionNames = {
      'all': '공통 질의',
      'k1': 'Keynote 1 · 주거난방',
      'k2': 'Keynote 2 · 액체냉각',
      'k3': 'Keynote 3 · AIDC 전력망',
      'i1': 'Insight 1 · 히트펌프',
      'i2': 'Insight 2 · 에너지컨설팅',
      'sl': 'Special · 과학인문학'
    };

    // 체크인 페이지(s0~s13)나 동적 세션 ID를 표준 세션 키로 정규화
    function normalizeSessionKey(rawKey, sessionNameStr) {
      if (!rawKey) return 'all';
      const k = String(rawKey).trim();
      if (['k1', 'k2', 'k3', 'i1', 'i2', 'sl', 'all'].includes(k)) return k;
      const name = String(sessionNameStr || '');
      if (name.includes('Keynote Session 1') || name.includes('주거난방')) return 'k1';
      if (name.includes('Keynote Session 2') || name.includes('액체냉각')) return 'k2';
      if (name.includes('Keynote Session 3') || name.includes('전력')) return 'k3';
      if (name.includes('Insight Session 1') || name.includes('히트펌프')) return 'i1';
      if (name.includes('Insight Session 2') || name.includes('에너지컨설팅')) return 'i2';
      if (name.includes('Special') || name.includes('인문학') || name.includes('테라포밍')) return 'sl';
      return k;
    }

    // Admin에서 수정된 세션 일정(hvac_schedule_settings)과 Q&A 드롭다운/탭 동기화
    function syncSessionOptionsFromAdmin() {
      try {
        const raw = localStorage.getItem('hvac_schedule_settings');
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.sessions) || data.sessions.length === 0) return;

        const lectureSessions = data.sessions.filter(s =>
          (s.type === 'session' && !(s.sublabel || '').includes('Opening') && !(s.title || '').includes('오프닝') && s.title !== 'Opening') ||
          (s.sublabel && (s.sublabel.includes('Keynote') || s.sublabel.includes('Insight') || s.sublabel.includes('Special')))
        );
        if (lectureSessions.length === 0) return;

        const selectEl = document.getElementById('askSession');
        const tabsEl = document.getElementById('sessionTabs');
        if (!selectEl || !tabsEl) return;

        selectEl.innerHTML = '<option value="all">세션을 선택하세요 (공통/전체)</option>';
        tabsEl.innerHTML = `<button class="tab-btn ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">전체 질문 (<span id="countAll">${questions.length}</span>)</button>`;

        lectureSessions.forEach((s, idx) => {
          const normKey = normalizeSessionKey(s.qnaKey || s.id || ('s' + idx), (s.sublabel || '') + ' ' + (s.title || ''));
          const shortTitle = (s.title || '').length > 14 ? s.title.slice(0, 14) + '…' : (s.title || `세션 ${idx + 1}`);
          const speakerPart = (s.speaker && s.speaker !== '-') ? ` (${s.speaker})` : '';
          const badgeLabel = `${s.sublabel || 'Session'} · ${shortTitle}`;
          sessionNames[normKey] = badgeLabel;

          const opt = document.createElement('option');
          opt.value = normKey;
          opt.textContent = `${s.sublabel || 'Session'}: ${s.title || ''}${speakerPart}`;
          selectEl.appendChild(opt);

          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (currentFilter === normKey ? ' active' : '');
          btn.setAttribute('data-filter', normKey);
          btn.textContent = shortTitle;
          tabsEl.appendChild(btn);
        });
      } catch (e) {}
    }

    function loadQuestionsFromStorage() {
      try {
        const saved = localStorage.getItem('hvac_qna_list');
        if (saved) {
          questions = JSON.parse(saved);
        } else {
          questions = [...defaultQuestions];
          localStorage.setItem('hvac_qna_list', JSON.stringify(questions));
        }
      } catch (e) {
        questions = [...defaultQuestions];
      }
    }

    loadQuestionsFromStorage();
    syncSessionOptionsFromAdmin();

    // 체크인된 이름이 있으면 작성자 필드 자동 채우기
    try {
      const user = localStorage.getItem('hvac_user_checked');
      if (user) {
        const parsed = JSON.parse(user);
        if (parsed && parsed.name) {
          document.getElementById('askAuthor').value = parsed.name;
        }
      }
    } catch (e) {}

    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 피드 렌더링
    function renderFeed() {
      const feed = document.getElementById('qnaFeed');
      const searchVal = (document.getElementById('qnaSearchBox').value || '').trim().toLowerCase();
      feed.innerHTML = '';

      const countAllEl = document.getElementById('countAll');
      if (countAllEl) countAllEl.textContent = questions.length;

      const filtered = questions.filter(q => {
        const qNormSession = normalizeSessionKey(q.session, q.sessionName);
        const matchSession = (currentFilter === 'all' || qNormSession === currentFilter || q.session === currentFilter);
        if (!matchSession) return false;
        if (searchVal) {
          const inContent = (q.content || '').toLowerCase().includes(searchVal);
          const inAuthor = (q.author || '').toLowerCase().includes(searchVal);
          const inSession = (q.sessionName || '').toLowerCase().includes(searchVal);
          return inContent || inAuthor || inSession;
        }
        return true;
      });

      if (filtered.length === 0) {
        feed.innerHTML = '<div class="empty-state">조건에 해당하는 질문이 없습니다. 첫 질문을 남겨보세요! ✋</div>';
        return;
      }

      if (currentSort === 'likes') {
        filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0) || (b.id || 0) - (a.id || 0));
      } else {
        filtered.sort((a, b) => (b.id || 0) - (a.id || 0));
      }

      filtered.forEach(q => {
        const card = document.createElement('div');
        card.className = 'qna-card' + (q.isStarred ? ' starred-card' : '');

        let statusBadgesHtml = '';
        if (q.isStarred) {
          statusBadgesHtml += '<span class="qna-status-tag starred">⭐ 채택 질문</span>';
        }
        if (q.isAnswered) {
          statusBadgesHtml += '<span class="qna-status-tag answered">✔️ 답변 완료</span>';
        }

        card.innerHTML = `
          <div class="qna-card-top">
            <div class="qna-badges-row">
              <span class="qna-session-badge">${escapeHtml(q.sessionName || '공통 질의')}</span>
              ${statusBadgesHtml}
            </div>
            <div class="qna-meta">
              <span>👤 ${escapeHtml(q.author || '익명')}</span>
              <span>🕒 ${escapeHtml(q.time || '')}</span>
            </div>
          </div>
          <div class="qna-body">${escapeHtml(q.content || '')}</div>
          <div class="qna-footer">
            <span style="font-size: 11.5px; opacity: 0.5;">세미나 현장 질문</span>
            <button class="btn-like ${q.isLiked ? 'liked' : ''}" type="button" data-id="${q.id}">
              👍 공감 ${q.likes || 0}
            </button>
          </div>
        `;
        feed.appendChild(card);
      });

      // 공감 버튼 이벤트
      feed.querySelectorAll('.btn-like').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.getAttribute('data-id'), 10);
          const target = questions.find(item => item.id === id);
          if (target) {
            if (!target.isLiked) {
              target.likes = (target.likes || 0) + 1;
              target.isLiked = true;
              showToast('👍 질문에 공감했습니다!');
            } else {
              target.likes = Math.max(0, (target.likes || 1) - 1);
              target.isLiked = false;
            }
            saveQuestions();
            renderFeed();
          }
        });
      });
    }

    function saveQuestions() {
      try {
        localStorage.setItem('hvac_qna_list', JSON.stringify(questions));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 탭 클릭 이벤트 위임
    document.getElementById('sessionTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-btn');
      if (!tab) return;
      document.querySelectorAll('#sessionTabs .tab-btn').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.getAttribute('data-filter');
      renderFeed();
    });

    // 검색 및 정렬 이벤트
    document.getElementById('qnaSearchBox').addEventListener('input', () => {
      renderFeed();
    });

    document.querySelectorAll('.btn-sort').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.getAttribute('data-sort');
        renderFeed();
      });
    });

    // 익명 체크박스
    const checkAnon = document.getElementById('checkAnon');
    const inputAuthor = document.getElementById('askAuthor');
    checkAnon.addEventListener('change', () => {
      if (checkAnon.checked) {
        inputAuthor.disabled = true;
        inputAuthor.style.opacity = '0.5';
      } else {
        inputAuthor.disabled = false;
        inputAuthor.style.opacity = '1';
      }
    });

    // 질문 등록 버튼
    document.getElementById('btnSubmitQ').addEventListener('click', () => {
      const content = document.getElementById('askContent').value.trim();
      const sessionKey = document.getElementById('askSession').value;
      let author = inputAuthor.value.trim();

      if (!content) {
        showToast('⚠️ 질문 내용을 입력해 주세요.');
        document.getElementById('askContent').focus();
        return;
      }

      if (checkAnon.checked || !author) {
        author = '익명 참가자';
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      const newQ = {
        id: Date.now(),
        session: sessionKey === 'all' ? 'k1' : sessionKey,
        sessionName: sessionNames[sessionKey] || '공통 질의',
        author: author,
        content: content,
        time: timeStr,
        likes: 1,
        isLiked: true,
        isStarred: false,
        isAnswered: false
      };

      questions.unshift(newQ);
      saveQuestions();
      document.getElementById('askContent').value = '';
      showToast('🎉 질문이 성공적으로 등록되었습니다!');
      renderFeed();
    });

    // 발표자 모드 (전광판 화면) 토글
    const btnPresenter = document.getElementById('btnPresenterMode');
    btnPresenter.addEventListener('click', () => {
      document.body.classList.toggle('presenter-mode');
      const isPresenter = document.body.classList.contains('presenter-mode');
      btnPresenter.classList.toggle('active', isPresenter);
      btnPresenter.textContent = isPresenter ? '📱 일반모드' : '🖥️ 발표모드';
      showToast(isPresenter ? '🖥️ 발표자/전광판 뷰로 전환되었습니다.' : '📱 일반 뷰로 전환되었습니다.');
    });

    // 다른 탭(관리자 페이지, 체크인 화면 등)에서 변경 시 실시간 자동 반영
    window.addEventListener('storage', (e) => {
      if (e.key === 'hvac_qna_list') {
        loadQuestionsFromStorage();
        renderFeed();
      } else if (e.key === 'hvac_schedule_settings') {
        syncSessionOptionsFromAdmin();
        renderFeed();
      }
    });

    // 초기 렌더링
    renderFeed();
  </script>
</body>
</html>
